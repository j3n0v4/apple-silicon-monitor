# Apple Silicon Monitor — Grafana Datasource Provisioning
#
# Auto-configures Prometheus as a data source in Grafana.
# The uid "prometheus" must match the datasource UID in dashboard JSON panels.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
    editable: true