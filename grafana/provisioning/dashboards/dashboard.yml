# Apple Silicon Monitor — Grafana Dashboard Provisioning
#
# Auto-provisions the asimon dashboard on Grafana startup.

apiVersion: 1

providers:
  - name: "Apple Silicon Monitor"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: true
    updateIntervalSeconds: 10
    options:
      path: /etc/grafana/provisioning/dashboards
