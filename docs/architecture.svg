<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="box1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f3460"/>
      <stop offset="100%" stop-color="#0a2647"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#533483"/>
      <stop offset="100%" stop-color="#3b1f6e"/>
    </linearGradient>
    <linearGradient id="box3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#c73e54"/>
    </linearGradient>
    <linearGradient id="box4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a936f"/>
      <stop offset="100%" stop-color="#147a5a"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e0e0e0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#e0e0e0" font-size="20" font-weight="bold">Apple Silicon Monitor — Architecture</text>

  <!-- Box: macmon -->
  <rect x="40" y="80" width="180" height="100" rx="8" fill="url(#box1)" filter="url(#shadow)"/>
  <text x="130" y="115" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="bold">macmon</text>
  <text x="130" y="135" text-anchor="middle" fill="#8899aa" font-size="11">Hardware Metrics</text>
  <text x="130" y="155" text-anchor="middle" fill="#8899aa" font-size="11">GPU/CPU temp, power,</text>
  <text x="130" y="170" text-anchor="middle" fill="#8899aa" font-size="11">freq, fans, swap, RAM</text>

  <!-- Box: Ollama -->
  <rect x="40" y="220" width="180" height="100" rx="8" fill="url(#box1)" filter="url(#shadow)"/>
  <text x="130" y="255" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="bold">Ollama</text>
  <text x="130" y="275" text-anchor="middle" fill="#8899aa" font-size="11">Inference Engine</text>
  <text x="130" y="295" text-anchor="middle" fill="#8899aa" font-size="11">tok/s, model size,</text>
  <text x="130" y="310" text-anchor="middle" fill="#8899aa" font-size="11">VRAM, load time</text>

  <!-- Box: asimon serve -->
  <rect x="300" y="120" width="200" height="160" rx="8" fill="url(#box2)" filter="url(#shadow)"/>
  <text x="400" y="155" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="bold">asimon serve</text>
  <text x="400" y="175" text-anchor="middle" fill="#b0a0c0" font-size="11">Collector + Exporter</text>
  <text x="400" y="195" text-anchor="middle" fill="#b0a0c0" font-size="11">:9100/metrics</text>
  <text x="400" y="215" text-anchor="middle" fill="#b0a0c0" font-size="11">SQLite storage</text>
  <text x="400" y="235" text-anchor="middle" fill="#b0a0c0" font-size="11">Alert checker</text>
  <text x="400" y="255" text-anchor="middle" fill="#b0a0c0" font-size="11">Benchmark runner</text>

  <!-- Box: asimon proxy -->
  <rect x="300" y="320" width="200" height="60" rx="8" fill="url(#box2)" filter="url(#shadow)"/>
  <text x="400" y="345" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="bold">asimon proxy</text>
  <text x="400" y="365" text-anchor="middle" fill="#b0a0c0" font-size="11">:11435 — Transparent Ollama proxy</text>

  <!-- Box: Prometheus -->
  <rect x="580" y="100" width="180" height="100" rx="8" fill="url(#box3)" filter="url(#shadow)"/>
  <text x="670" y="135" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="bold">Prometheus</text>
  <text x="670" y="155" text-anchor="middle" fill="#d0a0a0" font-size="11">:9090</text>
  <text x="670" y="175" text-anchor="middle" fill="#d0a0a0" font-size="11">Scrapes every 5s</text>
  <text x="670" y="190" text-anchor="middle" fill="#d0a0a0" font-size="11">Time-series DB</text>

  <!-- Box: Grafana -->
  <rect x="580" y="250" width="180" height="100" rx="8" fill="url(#box4)" filter="url(#shadow)"/>
  <text x="670" y="285" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="bold">Grafana</text>
  <text x="670" y="305" text-anchor="middle" fill="#a0d0b0" font-size="11">:3000</text>
  <text x="670" y="325" text-anchor="middle" fill="#a0d0b0" font-size="11">26-panel dashboard</text>
  <text x="670" y="340" text-anchor="middle" fill="#a0d0b0" font-size="11">Auto-provisioned</text>

  <!-- Arrows: macmon → asimon -->
  <line x1="220" y1="130" x2="295" y2="170" stroke="#e0e0e0" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arrows: Ollama → asimon proxy -->
  <line x1="220" y1="270" x2="295" y2="350" stroke="#e0e0e0" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arrows: asimon serve → Prometheus -->
  <line x1="500" y1="180" x2="575" y2="160" stroke="#e0e0e0" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arrows: Prometheus → Grafana -->
  <line x1="670" y1="200" x2="670" y2="245" stroke="#e0e0e0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Label: asimon proxy → Ollama (reverse) -->
  <text x="170" y="380" text-anchor="middle" fill="#666" font-size="10" font-style="italic">asimon proxy intercepts Ollama API calls</text>
  <text x="170" y="395" text-anchor="middle" fill="#666" font-size="10" font-style="italic">to capture inference metrics</text>

  <!-- Footer -->
  <text x="400" y="470" text-anchor="middle" fill="#555" font-size="11">Install: pip install apple-silicon-monitor  •  Run: asimon serve  •  Dashboard: localhost:3000</text>
</svg>
